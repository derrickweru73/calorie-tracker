<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Tracker Dashboard</title>
            <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

 

 </head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- Main Dashboard Container Card -->
    <div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-xl space-y-6 border border-slate-100">
        
        <h1 class="text-2xl font-black text-center text-indigo-600 tracking-tight">Daily Calorie Companion</h1>


        <!-- SECTION 1: Total Calorie Count Display Dashboard -->
        <div class="bg-indigo-600 text-white p-5 rounded-xl shadow-md text-center space-y-1">
            <p class="text-xs uppercase font-bold tracking-widest text-indigo-200">Total Calories Consumed</p>
            <h2 class="text-4xl font-black tracking-tight">
                <span id="total-calories">0</span> <span class="text-lg font-normal text-indigo-200">kcal</span>
            </h2>
        </div>

        <!-- SECTION 2: Form Element for Meal Captures -->
        <form id="calorie-form" class="space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-100">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Log New Meal Entry</h3>
            
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1" for="item-name">Food Item Name</label>
                <div class="flex gap-2">
                    <input type="text" id="item-name" placeholder="e.g., Banana, Coffee" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" required>
                    <!-- Fetch API Action Button Trigger -->
                    <button type="button" id="btn-suggest" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 rounded-lg transition-colors whitespace-nowrap cursor-pointer">
                         Fetch Cal
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1" for="item-calories">Calorie Value (kcal)</label>
                <input type="number" id="item-calories" placeholder="e.g., 105" min="1" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" required>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg shadow-sm transition-colors text-sm cursor-pointer">
                 Add Food Item
            </button>
        </form>

        <!-- SECTION 3: Food Item Display List Container -->
        <div class="space-y-2">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Today's Consumption Log</h3>
            <ul id="item-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                <!-- JavaScript updates DOM dynamically here -->
            </ul>
        </div>

        <!-- SECTION 4:  Reset Button Area -->
        <div class="pt-2 border-t border-slate-100">
            <button id="btn-reset" class="w-full bg-slate-100 hover:bg-rose-50 text-slate-500 hover:text-rose-600 text-xs font-bold py-2 rounded-lg transition-all tracking-wider uppercase cursor-pointer border border-slate-200 border-dashed hover:border-rose-200">
                 Reset Day & Clear Logs
            </button>
        </div>

    </div>

         
    <script src="script.js"></script>
</body>
</html>
