<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Tracker Dashboard</title>
            <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

 

 </head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- Main Dashboard Container Card -->
    <div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-xl space-y-6 border border-slate-100">
        
        <h1 class="text-2xl font-black text-center text-indigo-600 tracking-tight">Daily Calorie Companion</h1>


        <!-- SECTION 1: Total Calorie Count Display Dashboard -->
        <div class="bg-indigo-600 text-white p-5 rounded-xl shadow-md text-center space-y-1">
            <p class="text-xs uppercase font-bold tracking-widest text-indigo-200">Total Calories Consumed</p>
            <h2 class="text-4xl font-black tracking-tight">
                <span id="total-calories">0</span> <span class="text-lg font-normal text-indigo-200">kcal</span>
            </h2>
        </div>

         
    <script src="script.js"></script>
</body>
</html>
